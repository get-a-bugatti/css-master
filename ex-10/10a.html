<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>10A</title>
    <style>
      .container {
        display: block;
        border: 1.5px solid rgba(96, 96, 96, 0.4);
        width: 500px;
      }

      p {
        font-family: Arial;
      }

      .userpic-section,
      .userinfo-section,
      .followbtn-section {
        display: inline-block;
        vertical-align: middle;
      }

      .userpic-section,
      .followbtn-section {
        box-sizing: border-box;
        margin-right: 18px;
        margin-left: 18px;
      }

      .userpic-section {
        width: 80px;
      }

      .userinfo-section {
        width: 240px;
      }

      .followbtn-section {
        width: 80px;
      }

      .follow-button {
        width: 90px;
        height: 45px;
        font-size: 18px;
        font-weight: bold;
        color: white;
        background-color: rgb(65, 147, 239);
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .follow-button:hover {
        box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
      }

      .follow-button:active {
        opacity: 0.7;
      }

      .userpic {
        width: 100%;
        border-radius: 100px;
      }

      .user-name {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .user-bio {
        font-size: 20px;
        margin-top: 0px;
        margin-bottom: 10px;
      }

      .user-fame {
        margin-top: 0px;
        margin-bottom: 10px;
      }

      .user-bio,
      .user-fame {
        color: rgb(96, 96, 96);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="userpic-section">
        <img src="images/first-cat.png" alt="a cat's picture" class="userpic" />
      </div>
      <div class="userinfo-section">
        <p class="user-name">oliver</p>
        <p class="user-bio">the cat</p>
        <p class="user-fame">Popular</p>
      </div>
      <div class="followbtn-section">
        <button class="follow-button">Follow</button>
      </div>

      <div class="userpic-section">
        <img src="images/first-cat.png" alt="a cat's picture" class="userpic" />
      </div>
      <div class="userinfo-section">
        <p class="user-name">oliver</p>
        <p class="user-bio">the cat</p>
        <p class="user-fame">Popular</p>
      </div>
      <div class="followbtn-section">
        <button class="follow-button">Follow</button>
      </div>

      <div class="userpic-section">
        <img src="images/first-cat.png" alt="a cat's picture" class="userpic" />
      </div>
      <div class="userinfo-section">
        <p class="user-name">oliver</p>
        <p class="user-bio">the cat</p>
        <p class="user-fame">Popular</p>
      </div>
      <div class="followbtn-section">
        <button class="follow-button">Follow</button>
      </div>
    </div>
  </body>
</html>

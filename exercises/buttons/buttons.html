<style>
    * {
        font-size: 14;
    }

    button {
        margin-right: 8px;
    }

    .subscribe-button {
        background-color: #c40707;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 2px;
        cursor: pointer;
        transition: opacity 0.15s;
    }

    .subscribe-button:hover {
        opacity: 0.8;
    }

    .subscribe-button:active {
        opacity: 0.5;
    }

    .join-button {
        background-color: white;
        color: rgb(6, 95, 212);
        border: 1px solid rgb(6, 95, 212);
        border-radius: 2px;
        padding: 9px 15px;
        cursor: pointer;
        transition: background-color 0.25s, color 0.25s;
    }

    .join-button:hover {
        background-color: rgb(6, 95, 212);
        color: white;
    }

    .join-button:active {
        opacity: 0.65;
    }


    .tweet-button {
        font-weight: bold;
        color: white;
        background-color: rgb(25, 155, 226);
        border: none;
        padding: 11px 17px;
        border-radius: 100px;
        cursor: pointer;
        transition: box-shadow 0.15s;
    }

    .tweet-button:hover {
        box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);

    }

    .tweet-button:active {
        opacity: 0.7;
    }
</style>

<button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">Tweet</button>

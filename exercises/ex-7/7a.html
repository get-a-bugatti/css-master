<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        img {
            display: block;
            margin: 40px;
        }

        .profile-pic-round {
            width: 200px;
            border-radius: 20px;
        }

        .profile-pic-square {
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: 60% center;
            border: 2px solid black;
        }

        .profile-pic-circle {
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: 60% center;
            border-radius: 100%;
        }
    </style>
    <title>7A</title>
</head>

<body>
    <img src="../images.jpeg" alt="an image of a cat" class="profile-pic-round">
    <img src="../images.jpeg" alt="an image of a cat" class="profile-pic-square">
    <img src="../images.jpeg" alt="an image of a cat" class="profile-pic-circle">
</body>

</html>

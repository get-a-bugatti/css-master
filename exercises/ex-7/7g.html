<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exercise-7g</title>

    <style>
        .profile-pic,
        .status,
        .tweet-button {
            display: inline-block;
            vertical-align: middle;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 25px;
            margin-right: 10px;
        }


        .status {
            color: rgb(96, 96, 96);
            width: 250px;
            font-family: Arial;
            font-size: 14px;
        }

        .tweet-button {
            font-weight: bold;
            color: white;
            background-color: rgb(25, 155, 226);
            border: none;
            padding: 11px 17px;
            border-radius: 100px;
            cursor: pointer;
            transition: box-shadow 0.15s;
        }

        .tweet-button:hover {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);

        }

        .tweet-button:active {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <img src="../images.jpeg" alt="an image of a cat" class="profile-pic">
    <p class="status">What's happening ?</p>
    <button class="tweet-button">Tweet</button>
</body>

</html>
